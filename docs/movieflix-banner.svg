<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title description">
  <title id="title">MOVIEFLIX — movie discovery</title>
  <desc id="description">A cinematic night-sky banner with a glowing screen, floating film cards, and the tagline Find the film you feel like watching.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111126" />
      <stop offset=".52" stop-color="#211b3c" />
      <stop offset="1" stop-color="#101722" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#d4b8ff" />
      <stop offset=".48" stop-color="#9c8ce4" />
      <stop offset="1" stop-color="#343857" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a2ff" />
      <stop offset="1" stop-color="#f2d5b6" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a994ff" stop-opacity=".36" />
      <stop offset="1" stop-color="#a994ff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>
  <rect width="1440" height="460" rx="28" fill="url(#background)" />
  <ellipse cx="1090" cy="250" rx="390" ry="280" fill="url(#glow)" />
  <g fill="#fff" opacity=".68">
    <circle cx="825" cy="70" r="2" /><circle cx="1100" cy="55" r="1.5" />
    <circle cx="1320" cy="135" r="2" /><circle cx="925" cy="165" r="1.5" />
    <circle cx="1200" cy="375" r="1.5" /><circle cx="770" cy="330" r="1" />
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="90" y="83" width="42" height="42" rx="13" fill="#292242" stroke="#b9a2ff" />
    <path d="M104 113V96h4l10 11V96h4v17h-4l-10-11v11z" fill="#d5c8ff" />
    <text x="149" y="113" fill="#f3efff" font-size="25" font-weight="bold">MOVIE<tspan fill="#b9a2ff">FLIX</tspan></text>
    <text x="92" y="202" fill="#b9a2ff" font-size="13" font-weight="700" letter-spacing="3">A BETTER KIND OF MOVIE NIGHT</text>
    <text x="88" y="276" fill="#f7f4ff" font-size="57" font-weight="normal">Find the film you</text>
    <text x="88" y="343" fill="url(#accent)" font-family="Georgia, serif" font-size="65" font-style="italic">feel like watching.</text>
    <text x="92" y="393" fill="#b4b1c6" font-size="17">A mood-led movie finder for your next favorite story.</text>
  </g>
  <ellipse cx="1103" cy="389" rx="204" ry="27" fill="#080a12" opacity=".7" filter="url(#shadow)" />
  <g transform="translate(824 97) rotate(-12 105 145)">
    <rect width="204" height="288" rx="16" fill="#191a2b" stroke="#ffffff" stroke-opacity=".2" />
    <rect x="10" y="10" width="184" height="268" rx="10" fill="url(#screen)" />
    <circle cx="102" cy="96" r="49" fill="#f6dfbd" opacity=".92" />
    <path d="M10 212 75 136l36 42 27-29 56 68v61H10z" fill="#343955" />
    <path d="m10 233 62-55 39 39 28-23 55 48v36H10z" fill="#171d2d" />
    <rect x="25" y="230" width="90" height="4" rx="2" fill="#fff" opacity=".7" />
    <rect x="25" y="241" width="60" height="3" rx="1.5" fill="#fff" opacity=".36" />
  </g>
  <g transform="translate(1033 137) rotate(9 105 145)">
    <rect width="204" height="288" rx="16" fill="#191a2b" stroke="#ffffff" stroke-opacity=".2" />
    <rect x="10" y="10" width="184" height="268" rx="10" fill="#283b48" />
    <circle cx="105" cy="104" r="58" fill="#e2a56f" opacity=".9" />
    <path d="M10 194q46-68 92-8t92 0v92H10z" fill="#506778" />
    <path d="M10 228q48-49 90-3t94-5v58H10z" fill="#1c2938" />
    <path d="M29 36h45M29 47h28" stroke="#fff" stroke-linecap="round" stroke-opacity=".58" stroke-width="3" />
    <rect x="28" y="242" width="95" height="4" rx="2" fill="#fff" opacity=".7" />
    <rect x="28" y="253" width="57" height="3" rx="1.5" fill="#fff" opacity=".36" />
  </g>
  <g transform="translate(1232 169) rotate(17 70 105)" opacity=".65">
    <rect width="140" height="202" rx="14" fill="#191a2b" stroke="#ffffff" stroke-opacity=".2" />
    <rect x="8" y="8" width="124" height="186" rx="9" fill="#564268" />
    <circle cx="69" cy="78" r="37" fill="#e3a8b7" />
    <path d="M8 145q35-45 63-4t61-3v56H8z" fill="#242539" />
  </g>
  <path d="M756 90v279" stroke="#fff" stroke-opacity=".09" />
</svg>
